name: Check ATM balance

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run check script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python check_atm.py

      - name: Commit updated state
        run: |
          git config user.name "atm-bot"
          git config user.email "atm-bot@users.noreply.github.com"
          git add last_value.txt
          git diff --staged --quiet || git commit -m "update last value"
          git push
